name: runPythonTests
description: "Run Python tests, generate log and report"

inputs:
  testDescription:
    description: "Test description text, will be used on report"
    required: true
  testCommand:
    description: "Test command to be run"
    required: true
  logFile:
    description: "Path for log file"
    required: true
  reportFile:
    description: "Path for report file"
    required: true

runs:
  using: "composite"
  steps:
    - name: Run tests
      id: runTests
      shell: bash -l {0}
      env:
        LOG_FILE: ${{ inputs.logFile }}
        # Test output is piped (through sed into tee) rather than attached to a TTY, so
        # both the embedded Python interpreter and the C/C++ stdio layer switch to block
        # buffering. When a test then hangs and the step is killed by its
        # timeout-minutes, the buffered tail is discarded. That is why the Coin node
        # snapshot step timed out after 15 minutes and uploaded a 0-byte log, giving no
        # indication of how far it got.
        #
        # PYTHONUNBUFFERED alone is not enough: FreeCAD's own banner and unittest
        # progress are written by native code, which stayed block-buffered and was still
        # being lost. Line buffering for native stdio is therefore enabled below via
        # libstdbuf, the same mechanism stdbuf(1) uses, set through the environment.
        # Doing it with env vars rather than prefixing `stdbuf` to the command matters:
        # testCommand is arbitrary caller-supplied shell (it may start with its own
        # VAR=value assignments, and re-quoting it through `bash -c` would corrupt
        # commands containing quotes), so it must be run exactly as written.
        PYTHONUNBUFFERED: "1"
      run: |
        set -o pipefail
        LOG_FILE="${LOG_FILE//\\//}"
        mkdir -p "$(dirname "$LOG_FILE")"

        # Enable line-buffered native stdout/stderr when libstdbuf is available.
        # A missing library is not fatal: ld.so ignores an unusable LD_PRELOAD entry,
        # but skipping it keeps that warning out of every test log.
        for candidate in \
          /usr/libexec/coreutils/libstdbuf.so \
          /usr/lib/coreutils/libstdbuf.so \
          /usr/lib/x86_64-linux-gnu/coreutils/libstdbuf.so \
          /usr/lib64/coreutils/libstdbuf.so
        do
          if [ -f "$candidate" ]; then
            export _STDBUF_O=L _STDBUF_E=L
            export LD_PRELOAD="$candidate${LD_PRELOAD:+:$LD_PRELOAD}"
            break
          fi
        done

        {
          ${{ inputs.testCommand }}
        } 2>&1 | sed -Eue "/[[:blank:]]*\\([[:digit:]]{1,3} %\\)[[:blank:]]*/d" | tee -a "$LOG_FILE"
    - name: Write report
      shell: bash -l {0}
      if: always()
      env:
        LOG_FILE: ${{ inputs.logFile }}
        REPORT_FILE: ${{ inputs.reportFile }}
        TEST_DESCRIPTION: ${{ inputs.testDescription }}
        RUN_TESTS_OUTCOME: ${{ steps.runTests.outcome }}
      run: |
        LOG_FILE="${LOG_FILE//\\//}"
        REPORT_FILE="${REPORT_FILE//\\//}"
        mkdir -p "$(dirname "$LOG_FILE")"
        mkdir -p "$(dirname "$REPORT_FILE")"
        touch "$LOG_FILE"
        sed -ne "/^\(FAILED\|ERROR\):/,/^[[:blank:]]*$/bF; /^Traceback/,/^[^[:blank:]]/{/^Traceback/bT; /^[^[:blank:]]/G; bT}; b; :T w ${LOG_FILE}_tracebacks" -e "b; :F w ${LOG_FILE}_failedtests" "$LOG_FILE"
        icon=""
        if [ $( cat "${LOG_FILE}_tracebacks" | wc -l ) -gt 0 ]
        then
          icon=" :fire:"
        fi
        if [ "$RUN_TESTS_OUTCOME" == 'success' ]
        then
          echo "<details><summary>:heavy_check_mark: $TEST_DESCRIPTION succeeded$icon</summary>" >> "$REPORT_FILE"
        else
          echo "<details><summary>:fire: $TEST_DESCRIPTION failed$icon</summary>" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "Failed tests" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          cat "${LOG_FILE}_failedtests" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
        fi
        echo "" >> "$REPORT_FILE"
        if [ $( cat "${LOG_FILE}_tracebacks" | wc -l ) -gt 0 ]
        then
          echo "Uncaught tracebacks -- these tracebacks appeared during test but didn't fail a test --" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          cat "${LOG_FILE}_tracebacks" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
        fi
        echo "</details>">> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
