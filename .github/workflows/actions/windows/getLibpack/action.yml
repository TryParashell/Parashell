# This action aims at speeding up CI and reduce dependency to external resources
# by creating a cache of Libpack needed files then using it for CI runs rather
# than downloading every time.
#
# If it needs to be updated to another version, the process it to change
# 'downloadpath' and 'version' inputs below then delete the existing cache
# from Github interface so a new one is generated using new values.
#
# Note the cache service prefix-matches the primary key, so a key that happens
# to be a prefix of an older entry restores that older entry ("Cache hit for
# restore-key: ..."). Changing a key is therefore not enough to escape a bad
# cache; bump 'cachegeneration' so the new key is not a prefix of the old one.
#
# Do NOT graft modules from The Qt Company's precompiled Qt (e.g. via aqtinstall)
# into the LibPack. The LibPack builds Qt from source in the Release config, while
# the official binaries are RelWithDebInfo, and the two installs are usually
# different Qt versions. Qt's generated <Package>Targets.cmake globs its sibling
# <Package>Targets-<config>.cmake files, so a foreign per-config file dropped into
# lib/cmake breaks configuration: grafting Qt 6.8.3 over the 6.11.1 LibPack added
# Qt6LinguistToolsTargets-relwithdebinfo.cmake, which references Qt6::lprodump, a
# tool Qt removed in 6.11, producing "could not find TARGET Qt6::lprodump". The
# grafted WebEngineQuick was not even usable, because Qt6Config requires an EXACT
# version match for its components. In-application WebEngine views stay disabled
# on Windows until the LibPack itself ships qtwebengine.

name: getLibpack
description: "Windows: tries to get a cached version of Libpack and create one if fails"

inputs:
  libpackdir:
    description: "Directory where libpack files shall be stored"
    required: true
# Below inputs shall generally not be provided as they won't be used if a cached version exists
# They are mainly used because Github do not support adding env variables in a composite action
  libpackdownloadurl:
    description: "URL where to download libpack"
    required: false
    default: https://github.com/FreeCAD/FreeCAD-LibPack/releases/download/3.5.3/LibPack-26.3.0-v3.5.3-x64-Release.7z
  libpackname:
    description: "Libpack name (once downloaded)"
    required: false
    default: LibPack-26.3.0-v3.5.3-x64-Release
  cachegeneration:
    description: >-
      Salt for the cache key. The cache service prefix-matches the primary key,
      so a key that is a prefix of an older entry silently restores that older
      entry. Bump this to force a clean cache when the *contents* produced for
      an unchanged libpackname must change.
    required: false
    default: v2

runs:
  using: "composite"
  steps:
    - name: Create destination directory
      shell: bash
      run: |
        mkdir -p ${{ inputs.libpackdir }}
    - name: Get cached version
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: getCached
      with:
        path: ${{ inputs.libpackdir }}
        key: libpackforwin-${{ inputs.cachegeneration }}-${{ inputs.libpackname }}
    - name: Download libpack
      shell: bash
      if: steps.getCached.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        # The cache service prefix-matches the primary key, so reaching this step
        # does not mean the destination is empty: a near-miss entry may already
        # have been unpacked into it. Start from a clean directory so the extract
        # below cannot merge two different LibPacks (or fail with "Directory not
        # empty" while trying).
        rm -rf "${{ inputs.libpackdir }}"
        mkdir -p "${{ inputs.libpackdir }}"
        curl -L -o libpack.7z ${{ inputs.libpackdownloadurl }}
        7z x libpack.7z -o"libpacktemp" -r -y
        mv libpacktemp/${{ inputs.libpackname }}/* ${{ inputs.libpackdir }}
        rm -rf libpacktemp libpack.7z
    - name: Save version to cache
      if: steps.getCached.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.libpackdir }}
        key: ${{ steps.getCached.outputs.cache-primary-key }}
